spring.application.name=theatre-ticket-system
server.port=8080

# H2 in-memory database (swap for MySQL/PostgreSQL later - see README)
spring.datasource.url=jdbc:h2:mem:theatredb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Business rules
theatre.booking.max-seats-per-booking=6
theatre.booking.cancel-cutoff-hours=2
